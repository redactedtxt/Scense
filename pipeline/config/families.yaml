# The 14 Michael Edwards wheel families. `position` is the index on the ring
# (position 13 wraps round to 0). `harshness` is the base value used in profiles.
families:
  - { position: 0,  name: Soft Amber,       harshness: 0.15 }
  - { position: 1,  name: Amber,            harshness: 0.25 }
  - { position: 2,  name: Woody Amber,      harshness: 0.60 }
  - { position: 3,  name: Woods,            harshness: 0.40 }
  - { position: 4,  name: Mossy Woods,      harshness: 0.50 }
  - { position: 5,  name: Dry Woods,        harshness: 0.80 }
  - { position: 6,  name: Aromatic Fougère, harshness: 0.50 }
  - { position: 7,  name: Citrus,           harshness: 0.60 }
  - { position: 8,  name: Water,            harshness: 0.40 }
  - { position: 9,  name: Green,            harshness: 0.70 }
  - { position: 10, name: Fruity,           harshness: 0.30 }
  - { position: 11, name: Floral,           harshness: 0.30 }
  - { position: 12, name: Soft Floral,      harshness: 0.15 }
  - { position: 13, name: Floral Amber,     harshness: 0.30 }
