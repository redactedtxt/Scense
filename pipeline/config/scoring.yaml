# Every tunable number in the pairing model lives here. Change a value, then run
# the tune command (`make tune`) to rebuild profiles, scores and the database.
# The last three sections (search, browse, price) are read by the API only; editing them needs
# no pipeline run, just an API restart.

# Affinity by ring distance d = 0..7 (SPEC 3.5). Enhance rewards close families,
# Soften rewards families far round the ring.
affinity:
  # Enhance must stay positive definite (a test checks it), so a fragrance always
  # scores highest with itself.
  enhance: [1.0, 0.6, 0.3, 0.1, 0, 0, 0, 0]
  soften:  [0.2, 0.4, 0.6, 0.8, 0.9, 0.85, 0.75, 0.6]

# Enhance has no strength penalty: a stronger near-clone amplifies the base.
# Fragrance Enhance similarity uses the 14 families plus the 6 facets; each facet
# matches only itself, scaled by facet_weight. Notes use families only.
enhance:
  facet_weight: 1.0

# A "gap" is how many strength steps the partner may differ by before the
# penalty multiplier applies.
soften:
  strength_gap: 1          # partner weaker than base by more than this ...
  buried_penalty: 0.7      # ... gets buried, so multiply by this

# Strength 1..4 comes from the mean of the longevity and sillage vote scores
# (each 0..1). Cutoffs [c1, c2, c3]: < c1 -> 1, < c2 -> 2, < c3 -> 3, else 4.
strength_cutoffs: [0.46, 0.54, 0.62]
# ingest.py fails if a catalogue fragrance has fewer longevity + sillage votes.
# At 1,000 votes, resampling the same votes flips a bottle's strength bin about 3% of the
# time; at 50 it would be 20%. The 1,000-fragrance catalogue's lowest is 1,613.
min_strength_votes: 1000

# How many fragrances (by rating votes) make up the catalogue. The 1,000th has about
# 3,579 rating votes. The first 300 are the original catalogue; their ids are pinned in
# pinned_ids.csv (DECISIONS B28), so growing this number never changes them.
catalogue_size: 1000

# Tolerance for "weights sum to 1" checks on the mapping files and profiles.
weight_sum_tolerance: 0.000001

# Typo-tolerant search (DECISIONS B23). When full-text search finds nothing, a word
# counts as a near-miss for a catalogue word if pg_trgm's similarity() is at least this
# (0 to 1; 0.3 is pg_trgm's own default). Lower finds more, and wrong, matches.
search:
  fuzzy_min_similarity: 0.3

# Browse sort "Highest rated" (DECISIONS B24). The weighted rating is
#   (votes * rating + m * catalogue_mean_rating) / (votes + m)
# where m is this number: a bottle needs about m votes before its own rating counts as
# much as the catalogue average. The 1,000-fragrance catalogue has 3,600 to 37,000 votes per
# bottle (median ~5,900), so 6,000 keeps the intent of B24: about the median.
browse:
  rating_weight_votes: 6000

# Price guidance (DECISIONS B42), read by the API only. The dataset has no prices: the tier
# of each bottle comes from brand_tiers.csv and tier_overrides.csv, and these numbers only
# say what the tiers mean. Tiers are bands of typical retail price for a 100 ml bottle in
# CAD; the edges [e1, e2, e3] give $ under e1, $$ e1 to e2, $$$ e2 to e3, $$$$ over e3.
# The value-for-money indicator hides when a bottle has fewer votes than min_value_votes
# (every catalogue bottle has 198 or more today, so it is a guard for a bigger catalogue).
# budget_pull (0 to 1) is how hard a budget the visitor states (chat: "under $100",
# "affordable", "luxury"; concierge: a $ to $$$$ chip) pulls the picks: a bottle outside
# the budget keeps (1 - budget_pull) of its score, so a far better match can still win.
price:
  tier_edges_cad: [75, 150, 300]
  min_value_votes: 100
  budget_pull: 0.3
